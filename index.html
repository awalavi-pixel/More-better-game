<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Operation: Ghost Reboot</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; overflow: hidden; font-family: 'Arial Narrow', Arial, sans-serif; }
    #canvas { display: block; width: 100vw; height: 100vh; }
    .menu-title { color: #fff; font-size: 3rem; font-weight: 900; letter-spacing: 0.3em; text-transform: uppercase; margin-bottom: 3rem; text-shadow: 0 0 20px rgba(255,150,0,0.8); }
    .menu-subtitle { color: #888; font-size: 0.9rem; letter-spacing: 0.2em; margin-bottom: 4rem; text-transform: uppercase; }
    .menu-btn { background: transparent; border: 1px solid rgba(255,255,255,0.3); color: #fff; padding: 0.8rem 3rem; margin: 0.4rem; font-size: 1.1rem; letter-spacing: 0.2em; text-transform: uppercase; cursor: pointer; transition: all 0.2s; min-width: 280px; }
    .menu-btn:hover { background: rgba(255,150,0,0.2); border-color: rgba(255,150,0,0.8); color: #ffa500; }
    .menu-btn:active { transform: scale(0.97); }
    #loading-screen { position: fixed; inset: 0; background: #000; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 200; }
    #loading-bar-wrap { width: 400px; height: 3px; background: rgba(255,255,255,0.1); margin-top: 2rem; }
    #loading-bar { height: 100%; background: #ffa500; width: 0%; transition: width 0.3s; }
    #loading-text { color: #888; font-size: 0.75rem; letter-spacing: 0.3em; text-transform: uppercase; margin-top: 1rem; }
    #main-menu { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(0,0,0,0.85); z-index: 100; }
    #pause-menu { position: fixed; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; background: rgba(0,0,0,0.6); backdrop-filter: blur(8px); z-index: 90; }
    #options-menu { position: fixed; inset: 0; background: rgba(0,0,0,0.9); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 110; }
    .options-section { color: #fff; margin: 1rem 0; width: 400px; }
    .options-section h3 { font-size: 0.8rem; letter-spacing: 0.3em; color: #ffa500; text-transform: uppercase; margin-bottom: 0.8rem; border-bottom: 1px solid rgba(255,165,0,0.3); padding-bottom: 0.4rem; }
    .option-row { display: flex; justify-content: space-between; align-items: center; padding: 0.4rem 0; font-size: 0.9rem; }
    .option-row label { color: rgba(255,255,255,0.7); }
    .option-row input[type=range] { width: 150px; accent-color: #ffa500; }
    .option-row select { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: #fff; padding: 0.2rem 0.5rem; }
    #pointer-lock-msg { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(0,0,0,0.7); color: #fff; font-size: 1.2rem; letter-spacing: 0.2em; text-transform: uppercase; z-index: 50; }
    #hud { position: fixed; inset: 0; pointer-events: none; display: none; }
    #fps-counter { position: fixed; top: 0.5rem; left: 0.5rem; color: rgba(255,255,255,0.4); font-size: 0.7rem; font-family: monospace; }
    #ammo-display { position: fixed; bottom: 2rem; left: 2rem; color: #fff; font-size: 1.8rem; font-weight: bold; }
    #ammo-reserve { color: rgba(255,255,255,0.5); font-size: 1rem; }
    #weapon-name { position: fixed; bottom: 4.5rem; left: 2rem; color: rgba(255,200,100,0.8); font-size: 0.75rem; letter-spacing: 0.2em; text-transform: uppercase; }
    #health-display { position: fixed; bottom: 2rem; right: 12rem; color: #fff; font-size: 1.4rem; }
    #health-bar-wrap { position: fixed; bottom: 2rem; right: 2rem; width: 8rem; height: 4px; background: rgba(255,255,255,0.2); }
    #health-bar { height: 100%; background: linear-gradient(90deg, #f00, #fa0); transition: width 0.3s; }
    #damage-overlay { position: fixed; inset: 0; pointer-events: none; }
    #low-health-overlay { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(ellipse at center, transparent 30%, rgba(180,0,0,0.5) 100%); opacity: 0; transition: opacity 0.3s; }
    #objective-text { position: fixed; top: 1.5rem; left: 50%; transform: translateX(-50%); color: rgba(255,200,100,0.9); font-size: 0.8rem; letter-spacing: 0.25em; text-transform: uppercase; text-align: center; }
    #kill-feed { position: fixed; top: 1rem; right: 1rem; display: flex; flex-direction: column; gap: 0.3rem; pointer-events: none; }
    .kill-entry { background: rgba(0,0,0,0.6); color: #fff; padding: 0.2rem 0.6rem; font-size: 0.75rem; letter-spacing: 0.1em; animation: fadeKill 3s forwards; }
    @keyframes fadeKill { 0%,70%{opacity:1} 100%{opacity:0} }
    #crosshair { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); pointer-events: none; display: none; }
    #hit-marker { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); pointer-events: none; display: none; opacity: 0; }
    #subtitles { position: fixed; bottom: 8rem; left: 50%; transform: translateX(-50%); max-width: 600px; text-align: center; pointer-events: none; }
    .subtitle-line { background: rgba(0,0,0,0.7); color: #fff; padding: 0.3rem 0.8rem; margin: 0.2rem; display: inline-block; font-size: 0.95rem; }
    .subtitle-speaker { color: #ffa500; }
    #grenade-display { position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%); display: flex; gap: 0.5rem; }
    .grenade-icon { width: 36px; height: 36px; border: 1px solid rgba(255,255,255,0.4); border-radius: 4px; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; color: #fff; font-size: 1.2rem; }
    #mission-title-card { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; opacity: 0; transition: opacity 0.8s; pointer-events: none; }
    #mission-title-card h2 { color: rgba(255,150,0,0.9); font-size: 0.9rem; letter-spacing: 0.5em; text-transform: uppercase; margin-bottom: 0.5rem; }
    #mission-title-card h1 { color: #fff; font-size: 2.5rem; font-weight: 900; letter-spacing: 0.3em; text-transform: uppercase; }
    #minimap { position: fixed; top: 1rem; right: 1rem; width: 160px; height: 160px; border-radius: 50%; overflow: hidden; border: 1px solid rgba(255,255,255,0.2); background: rgba(0,0,0,0.5); }
    #minimap-canvas { width: 100%; height: 100%; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>

  <div id="loading-screen">
    <div class="menu-title" style="font-size:2rem;">OPERATION: GHOST REBOOT</div>
    <div id="loading-bar-wrap"><div id="loading-bar"></div></div>
    <div id="loading-text">INITIALIZING...</div>
  </div>

  <div id="main-menu" class="hidden">
    <div class="menu-title">GHOST REBOOT</div>
    <div class="menu-subtitle">Operation Ghost Reboot — A Ghost Story</div>
    <button class="menu-btn" id="btn-campaign">Campaign</button>
    <button class="menu-btn" id="btn-multiplayer">Multiplayer (Bots)</button>
    <button class="menu-btn" id="btn-options">Options</button>
  </div>

  <div id="pause-menu">
    <div class="menu-title" style="font-size:1.5rem;">PAUSED</div>
    <button class="menu-btn" id="btn-resume">Resume</button>
    <button class="menu-btn" id="btn-checkpoint">Reload Checkpoint</button>
    <button class="menu-btn" id="btn-pause-options">Options</button>
    <button class="menu-btn" id="btn-quit-menu">Quit to Menu</button>
  </div>

  <div id="options-menu">
    <div class="menu-title" style="font-size:1.5rem;">OPTIONS</div>
    <div class="options-section">
      <h3>Graphics</h3>
      <div class="option-row"><label>Field of View</label><input type="range" id="opt-fov" min="70" max="110" value="90"><span id="opt-fov-val">90</span></div>
    </div>
    <div class="options-section">
      <h3>Audio</h3>
      <div class="option-row"><label>Master Volume</label><input type="range" id="opt-master" min="0" max="100" value="80"><span id="opt-master-val">80</span></div>
    </div>
    <div class="options-section">
      <h3>Controls</h3>
      <div class="option-row"><label>Mouse Sensitivity</label><input type="range" id="opt-sens" min="1" max="20" value="8"><span id="opt-sens-val">8</span></div>
      <div class="option-row"><label>Invert Y</label><input type="checkbox" id="opt-invert-y"></div>
    </div>
    <button class="menu-btn" id="btn-options-back" style="margin-top:2rem;">Back</button>
  </div>

  <div id="pointer-lock-msg">CLICK TO PLAY</div>

  <div id="hud">
    <div id="fps-counter">60 FPS</div>
    <div id="objective-text">MISSION 01 — GHOST TOWN</div>
    <div id="mission-title-card">
      <h2>Act I — Initiation</h2>
      <h1>Ghost Town</h1>
    </div>
    <div id="weapon-name">MSBS</div>
    <div id="ammo-display">
      <span id="ammo-current">30</span>
      <span> / </span>
      <span id="ammo-reserve" class="ammo-reserve">90</span>
    </div>
    <div id="health-display">
      <span id="health-val">100</span>
    </div>
    <div id="health-bar-wrap"><div id="health-bar" style="width:100%"></div></div>
    <div id="damage-overlay"></div>
    <div id="low-health-overlay"></div>
    <div id="kill-feed"></div>
    <div id="subtitles"></div>
    <div id="grenade-display">
      <div class="grenade-icon" id="grenade-lethal">💣</div>
      <div class="grenade-icon" id="grenade-tactical">💡</div>
    </div>
  </div>

  <svg id="crosshair" width="40" height="40" viewBox="0 0 40 40">
    <line x1="20" y1="2" x2="20" y2="14" stroke="white" stroke-width="1.5" opacity="0.9"/>
    <line x1="20" y1="26" x2="20" y2="38" stroke="white" stroke-width="1.5" opacity="0.9"/>
    <line x1="2" y1="20" x2="14" y2="20" stroke="white" stroke-width="1.5" opacity="0.9"/>
    <line x1="26" y1="20" x2="38" y2="20" stroke="white" stroke-width="1.5" opacity="0.9"/>
    <circle cx="20" cy="20" r="1.5" fill="white" opacity="0.6"/>
  </svg>

  <svg id="hit-marker" width="24" height="24" viewBox="0 0 24 24">
    <line x1="2" y1="2" x2="10" y2="10" stroke="#ff4444" stroke-width="2"/>
    <line x1="14" y1="14" x2="22" y2="22" stroke="#ff4444" stroke-width="2"/>
    <line x1="22" y1="2" x2="14" y2="10" stroke="#ff4444" stroke-width="2"/>
    <line x1="10" y1="14" x2="2" y2="22" stroke="#ff4444" stroke-width="2"/>
  </svg>

  <div id="minimap"><canvas id="minimap-canvas" width="160" height="160"></canvas></div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
